<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>IBADAT Hospital - Attendance Scanner</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.48),
          rgba(0, 0, 0, 0.58)
        ),
        url("hospital.jpeg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    /* Hospital Header */
    .header {
      text-align: center;
      color: white;
      margin-bottom: 18px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }

    .hospital-name {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .system-name {
      font-size: 18px;
      font-weight: 500;
    }

    .subtitle {
      font-size: 14px;
      margin-top: 7px;
      opacity: 0.9;
    }

    /* Scanner Box */
    .scanner-card {
      width: 100%;
      max-width: 430px;

      background: rgba(255,255,255,0.96);

      border-radius: 22px;

      padding: 18px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.35);

      text-align: center;
    }

    .scanner-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #222;
    }

    #reader {
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      background: #111;
    }

    /* Status */
    #status {
      margin-top: 15px;
      min-height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
      font-weight: bold;

      border-radius: 10px;
      padding: 10px;

      color: #333;
      background: #f1f1f1;
    }

    .success {
      color: #075e19 !important;
      background: #d9f7df !important;
    }

    .error {
      color: #8b0000 !important;
      background: #ffe0e0 !important;
    }

    .processing {
      color: #714900 !important;
      background: #fff1c7 !important;
    }

    /* Instruction */
    .instruction {
      margin-top: 13px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Device */
    .device-info {
      margin-top: 12px;
      font-size: 10px;
      color: #777;
      word-break: break-all;
    }

    /* Footer */
    .footer {
      color: white;
      text-align: center;
      margin-top: 18px;

      font-size: 12px;

      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Mobile / Tablet */
    @media (max-width: 600px) {

      .main-container {
        padding: 12px;
      }

      .hospital-name {
        font-size: 27px;
      }

      .system-name {
        font-size: 16px;
      }

      .scanner-card {
        padding: 14px;
      }

      .scanner-title {
        font-size: 19px;
      }
    }

  </style>
</head>

<body>

  <div class="main-container">

    <!-- HEADER -->
    <div class="header">

      <div class="hospital-name">
        IBADAT HOSPITAL
      </div>

      <div class="system-name">
        STAFF ATTENDANCE SYSTEM
      </div>

      <div class="subtitle">
        Scan your Staff ID QR Code
      </div>

    </div>


    <!-- SCANNER -->
    <div class="scanner-card">

      <div class="scanner-title">
        📷 Scan Staff QR Code
      </div>

      <div id="reader"></div>

      <div id="status">
        Please scan your QR Code
      </div>

      <div class="instruction">
        Place the QR code inside the scanner area.
        <br>
        Your attendance will be recorded automatically.
      </div>

      <div class="device-info" id="deviceInfo"></div>

    </div>


    <!-- FOOTER -->
    <div class="footer">
      Authorized Staff Attendance
      <br>
      © IBADAT HOSPITAL
    </div>

  </div>


<script>

  /* =====================================================
     GOOGLE APPS SCRIPT URL
     ===================================================== */

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbymIUtdsG9jhl3RjcL3sxIFL5_AbYELjFK0Vnv0soE4pKsesEU9AQ2iDPf6VExpjzvt0w/exec";


  /* =====================================================
     REGISTERED TABLET DEVICE ID
     ===================================================== */

  const DEVICE_ID =
    "DEVICE-1788521073961-83gldrc7";


  /* =====================================================
     VARIABLES
     ===================================================== */

  let scanner = null;
  let isProcessing = false;


  /* =====================================================
     SHOW DEVICE
     ===================================================== */

  document.getElementById("deviceInfo").innerHTML =
    "Device: " + DEVICE_ID;


  /* =====================================================
     STATUS FUNCTION
     ===================================================== */

  function showStatus(message, type = "") {

    const status =
      document.getElementById("status");

    status.innerHTML = message;

    status.className = "";

    if (type) {
      status.classList.add(type);
    }
  }


  /* =====================================================
     EXTRACT STAFF ID FROM QR
     ===================================================== */

  function extractStaffId(text) {

    text = String(text || "").trim();

    if (!text) {
      return "";
    }

    try {

      /*
       * If QR contains:
       * https://example.com/?id=STAFF001
       */

      if (text.includes("id=")) {

        const url = new URL(text);

        const id =
          url.searchParams.get("id");

        if (id) {
          return id.trim();
        }
      }

    } catch (error) {
      // QR may simply contain Staff ID
    }


    /*
     * If QR directly contains:
     * STAFF001
     */

    return text;
  }


  /* =====================================================
     SEND ATTENDANCE
     ===================================================== */

  function sendAttendance(staffId) {

    if (isProcessing) {
      return;
    }

    isProcessing = true;

    showStatus(
      "⏳ Recording attendance...",
      "processing"
    );


    /*
     * JSONP callback
     */

    const callbackName =
      "attendanceCallback_" +
      Date.now();


    window[callbackName] =
      function(response) {

        try {

          console.log(
            "Attendance Response:",
            response
          );


          let message =
            response;


          /*
           * If Apps Script returns an object
           */

          if (
            typeof response === "object" &&
            response !== null
          ) {

            if (response.message) {
              message = response.message;
            }

            else if (response.status) {
              message = response.status;
            }

            else {
              message =
                JSON.stringify(response);
            }

          }


          /*
           * SUCCESS
           */

          if (
            String(message)
              .toLowerCase()
              .includes("❌")
          ) {

            showStatus(
              message,
              "error"
            );

          } else {

            showStatus(
              "✅ " + message,
              "success"
            );
          }


          /*
           * Wait before next scan
           */

          setTimeout(
            function() {

              isProcessing = false;

              showStatus(
                "Please scan the next Staff QR Code"
              );

            },
            4000
          );


        } catch (error) {

          console.error(error);

          showStatus(
            "❌ Attendance processing error",
            "error"
          );

          setTimeout(
            function() {
              isProcessing = false;
            },
            3000
          );
        }


        /*
         * Remove JSONP script
         */

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

        delete window[callbackName];
      };


    /*
     * Build Apps Script URL
     */

    const url =
      GOOGLE_SCRIPT_URL +
      "?mode=attendance" +
      "&staffId=" +
      encodeURIComponent(staffId) +
      "&deviceId=" +
      encodeURIComponent(DEVICE_ID) +
      "&callback=" +
      encodeURIComponent(callbackName);


    console.log(
      "Sending attendance:",
      url
    );


    /*
     * JSONP script
     */

    const script =
      document.createElement("script");

    script.id = callbackName;

    script.src = url;

    script.onerror =
      function() {

        showStatus(
          "❌ Connection Error. Please check Internet.",
          "error"
        );

        isProcessing = false;

        if (script) {
          script.remove();
        }

        delete window[callbackName];
      };


    document.body.appendChild(script);

  }


  /* =====================================================
     QR SCANNED
     ===================================================== */

  function onScanSuccess(decodedText) {

    if (isProcessing) {
      return;
    }


    console.log(
      "QR Scanned:",
      decodedText
    );


    const staffId =
      extractStaffId(decodedText);


    if (!staffId) {

      showStatus(
        "❌ Staff ID not found",
        "error"
      );

      return;
    }


    console.log(
      "Staff ID:",
      staffId
    );


    sendAttendance(staffId);

  }


  /* =====================================================
     QR ERROR
     ===================================================== */

  function onScanFailure(error) {

    /*
     * Normal scanning errors are ignored.
     * Do not show them to staff.
     */

  }


  /* =====================================================
     START SCANNER
     ===================================================== */

  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth * 0.75,
            viewfinderHeight * 0.75
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true

    };


    scanner
      .start(
        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      )

      .then(
        function() {

          showStatus(
            "📷 Ready — Scan Staff QR Code"
          );

        }
      )

      .catch(
        function(error) {

          console.error(
            "Camera Error:",
            error
          );


          showStatus(
            "❌ Camera permission required. Please allow camera access.",
            "error"
          );

        }
      );

  }


  /* =====================================================
     START WHEN PAGE LOADS
     ===================================================== */

  window.addEventListener(
    "load",
    function() {

      setTimeout(
        startScanner,
        500
      );

    }
  );

</script>

</body>
</html>
