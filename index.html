<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IBADAT Hospital Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
   body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;

  background-image:
    linear-gradient(rgba(255,255,255,0.82), rgba(255,255,255,0.82)),
    url("hospital.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
    }
    #reader {
  width: 320px !important;
  max-width: 90% !important;
  margin: 20px auto !important;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 15px;
}

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
    }

    h2 {
      margin: 5px 0 20px;
      font-size: 18px;
      color: #555;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .ready {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .processing {
      background: #fff3cd;
      color: #856404;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .device {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>IBADAT HOSPITAL</h1>
  <h2>Staff Attendance System</h2>

  <div id="reader"></div>

  <div id="result" class="ready">
    📷 READY TO SCAN
  </div>

  <div class="device" id="deviceInfo"></div>

</div>

<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbymIUtdsG9jhl3RjcL3sxIFL5_AbYELjFK0Vnv0soE4pKsesEU9AQ2iDPf6VExpjzvt0w/exec";

let scanningLocked = false;


// ==========================================
// DEVICE ID
// ==========================================

function getDeviceId() {

  let deviceId = localStorage.getItem("IBADAT_DEVICE_ID");

  if (!deviceId) {

    deviceId =
      "DEVICE-" +
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 8);

    localStorage.setItem(
      "IBADAT_DEVICE_ID",
      deviceId
    );
  }

  return deviceId;
}


const DEVICE_ID = "DEVICE-1788521073961-83gldrc7";

document.getElementById("deviceInfo").innerHTML =
  "Device ID: " + DEVICE_ID;


// ==========================================
// START QR SCANNER
// ==========================================

function startScanner() {

  const scanner = new Html5Qrcode("reader");

  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (scanningLocked) return;

      const staffId = extractStaffId(decodedText);

      if (!staffId) {

        showResult(
          "❌ Invalid Staff QR Code",
          "error"
        );

        return;
      }

      scanningLocked = true;

      showResult(
        "⏳ Processing...<br><br>Staff ID: " + staffId,
        "processing"
      );

      sendAttendance(staffId);

    }

  ).catch(function(error) {

    showResult(
      "❌ Camera Error<br><br>" + error,
      "error"
    );

  });

}


// ==========================================
// EXTRACT STAFF ID FROM QR
// ==========================================

function extractStaffId(text) {

  text = String(text).trim();

  try {

    const url = new URL(text);

    const id = url.searchParams.get("id");

    if (id) {
      return id.trim();
    }

  } catch (e) {}

  // If QR contains plain Staff ID
  if (
    text.length > 0 &&
    text.length < 100 &&
    !text.includes(" ")
  ) {

    return text;
  }

  return null;
}


// ==========================================
// SEND ATTENDANCE
// JSONP - NO FETCH / NO CORS ERROR
// ==========================================

function sendAttendance(staffId) {

  const callbackName =
    "attendanceCallback_" +
    Date.now();

  const script =
    document.createElement("script");

  const url =
    GOOGLE_SCRIPT_URL +
    "?mode=attendance" +
    "&staffId=" +
    encodeURIComponent(staffId) +
    "&deviceId=" +
    encodeURIComponent(DEVICE_ID) +
    "&callback=" +
    callbackName;

  window[callbackName] = function(result) {

    showResult(
      result,
      "success"
    );

    cleanup();

    setTimeout(function() {

      scanningLocked = false;

      showResult(
        "📷 READY TO SCAN",
        "ready"
      );

    }, 4000);

  };


  script.onerror = function() {

    showResult(
      "❌ Connection Error<br><br>" +
      "Cannot connect to attendance server.",
      "error"
    );

    cleanup();

    setTimeout(function() {

      scanningLocked = false;

      showResult(
        "📷 READY TO SCAN",
        "ready"
      );

    }, 4000);

  };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }

  }


  script.src = url;

  document.body.appendChild(script);
}


// ==========================================
// SHOW RESULT
// ==========================================

function showResult(message, type) {

  const result =
    document.getElementById("result");

  result.innerHTML = message;

  result.className = type;
}


// ==========================================
// START
// ==========================================

startScanner();

</script>

</body>
</html>
